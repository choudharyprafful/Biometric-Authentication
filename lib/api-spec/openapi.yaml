openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SecureAI - Biometric Security Demo API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: security
    description: Security monitoring
  - name: payments
    description: Payment operations
  - name: uploads
    description: Encrypted file uploads (text, image, video)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status, including whether the database answers
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The database did not answer within 3 seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/parent-consent/verify:
    post:
      operationId: verifyParentConsent
      tags: [auth]
      summary: A parent/guardian confirms a minor-registered account, via the link generated at registration
      description: Unauthenticated by design — the parent has no account of their own. Security rests on the token being long, single-use, and only ever known to whoever received the (emailed, or dev-mode returned) link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyParentConsentInput"
      responses:
        "200":
          description: Consent recorded — the account is no longer gated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyParentConsentResult"
        "400":
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login step 1 - email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Login step 1 successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/face-verify:
    post:
      operationId: faceVerify
      tags: [auth]
      summary: Login step 2 - biometric face verification MFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaceVerifyInput"
      responses:
        "200":
          description: Face verification successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Face verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link
      description: Always returns the same response whether or not the email is registered, to avoid leaking account existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset link issued if the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResult"

  /auth/reset-password/verify:
    post:
      operationId: verifyResetToken
      tags: [auth]
      summary: Check a reset token and report which biometric/passkey second factors are available
      description: A reset link alone is not enough to change the password — the account's face or passkey must also verify, same as login MFA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyResetTokenInput"
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResetTokenResult"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password/face:
    post:
      operationId: resetPasswordWithFace
      tags: [auth]
      summary: Complete a password reset by matching a live face scan against the enrolled descriptor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordFaceInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResult"
        "400":
          description: Invalid/expired token or malformed face data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Face did not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout current session
      responses:
        "204":
          description: Logged out successfully

  /auth/logout-all:
    post:
      operationId: logoutAllDevices
      tags: [auth]
      summary: Sign out of every device — session revocation
      description: Deletes every persisted session belonging to this account, not just the current one. Addresses the "device theft while unlocked" scenario — a stolen device with a valid session can be locked out from any other device, without needing to change the password.
      responses:
        "200":
          description: All sessions terminated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutAllResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin or it_support)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user — self-service ("delete my profile") or admin-driven
      description: Self-deletion is step-up authenticated — the account's current password must be re-submitted even though the session is already logged in, since account deletion shouldn't be completable by anyone who merely has access to an already-unlocked session. Not required when an admin deletes a different account.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserConfirmation"
      responses:
        "204":
          description: User deleted
        "401":
          description: Password re-verification failed (self-delete only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/enroll-face:
    post:
      operationId: enrollFace
      tags: [users]
      summary: Enroll face biometric for a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaceEnrollment"
      responses:
        "200":
          description: Face enrolled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid face data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/face:
    delete:
      operationId: removeFace
      tags: [users]
      summary: Remove face enrollment for a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Face enrollment removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/reset-mfa:
    post:
      operationId: resetUserMfa
      tags: [users]
      summary: Force-clear a user's face + passkey enrollment (admin or it_support only)
      description: Clears the stored face descriptor and deletes every enrolled passkey for the account, so the user is routed back through /enroll. For unblocking a locked-out user who lost their device/face access — not a self-service action.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: MFA enrollment cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: Admin or it_support access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/payment-hold:
    delete:
      operationId: clearPaymentHold
      tags: [users]
      summary: Clear the payment hold placed after a lost chargeback (admin only)
      description: Lets the account make purchases again. Recorded in the audit log as PAYMENT_HOLD_CLEARED.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Hold cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/reset-password:
    post:
      operationId: staffResetPassword
      tags: [users]
      summary: Issue a password reset link on behalf of a user (admin or it_support only)
      description: Same single-use, time-limited token mechanism as self-service /auth/forgot-password — no email provider is configured for this demo, so the link is returned directly outside production.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Reset link issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResult"
        "403":
          description: Admin or it_support access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /security/dashboard:
    get:
      operationId: getSecurityDashboard
      tags: [security]
      summary: Get security dashboard statistics
      responses:
        "200":
          description: Security dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityDashboard"

  /security/logs:
    get:
      operationId: listSecurityLogs
      tags: [security]
      summary: List security audit logs
      parameters:
        - in: query
          name: limit
          schema:
            type: number
            default: 50
        - in: query
          name: offset
          schema:
            type: number
            default: 0
        - in: query
          name: eventType
          schema:
            type: string
        - in: query
          name: userEmail
          description: Case-insensitive partial match against the actor's email
          schema:
            type: string
        - in: query
          name: ipAddress
          description: Case-insensitive partial match against the request's origin IP
          schema:
            type: string
        - in: query
          name: fromDate
          description: ISO 8601 timestamp — only logs at or after this time
          schema:
            type: string
        - in: query
          name: toDate
          description: ISO 8601 timestamp — only logs at or before this time
          schema:
            type: string
      responses:
        "200":
          description: Security logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityLog"

  /security/threats:
    get:
      operationId: listThreats
      tags: [security]
      summary: List threat assessments
      responses:
        "200":
          description: Threat assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Threat"

  /security/logs/verify:
    get:
      operationId: verifyLogIntegrity
      tags: [security]
      summary: Recompute the audit log hash chain and report whether it's intact (admin only)
      responses:
        "200":
          description: Chain verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogChainVerification"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /security/logs/repair:
    post:
      operationId: repairLogChain
      tags: [security]
      summary: Quarantine the untrustworthy tail of a broken hash chain and log the repair (security_analyst only)
      responses:
        "200":
          description: Repair result — no-op if the chain was already valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainRepairResult"
        "403":
          description: Security analyst access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /security/logs/restore:
    post:
      operationId: restoreLogChain
      tags: [security]
      summary: Re-insert deleted rows from the deletion-audit trigger's pre-delete snapshots, and log the restoration (security_analyst only)
      responses:
        "200":
          description: Restore result — no-op if the chain was already valid, or if the break wasn't caused by a deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainRestoreResult"
        "403":
          description: Security analyst access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /security/logs/deletions:
    get:
      operationId: listDeletionAudit
      tags: [security]
      summary: Forensic view of every security_logs deletion the database trigger has captured, app-initiated or raw SQL alike (security_analyst only)
      responses:
        "200":
          description: Deletion audit entries, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeletionAuditEntry"
        "403":
          description: Security analyst access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/privacy-policy:
    get:
      operationId: getMyPrivacyPolicyStatus
      tags: [users]
      summary: Which privacy policy version is current, and which one this account last acknowledged
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyPolicyStatus"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/privacy-policy/acknowledge:
    post:
      operationId: acknowledgePrivacyPolicy
      tags: [users]
      summary: Record that this account has been shown the current privacy policy
      description: Recorded in the tamper-evident audit log as PRIVACY_POLICY_ACKNOWLEDGED. The version must be the current one, so nobody is recorded as having seen text they were not shown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyPolicyAcknowledgeInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyPolicyStatus"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The version shown is not the current one; reload the policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/export:
    get:
      operationId: exportMyData
      tags: [users]
      summary: Download a copy of this account's personal data (privacy policy section 11)
      description: One JSON file with the account, consents, sign-in methods, uploads (file content included up to a total size limit), payments, the account's own security events and privacy-policy acknowledgements. The face template is described but not included. Limited to 5 exports per hour; each export is audit-logged as DATA_EXPORTED.
      responses:
        "200":
          description: The export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExport"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many exports in the last hour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/training-consent:
    post:
      operationId: setTrainingConsent
      tags: [behavior]
      summary: Opt in or out of contributing this account's activity to the behavior model's training corpus
      description: Separate from dataConsentGiven — using the app is not the same as consenting to have your activity used to train the behavior model. Toggleable any time, unlike account-level consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTrainingConsentInput"
      responses:
        "200":
          description: Consent state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /behavior/suggested-action:
    get:
      operationId: getSuggestedAction
      tags: [behavior]
      summary: A suggested next action, predicted by the behavior model from this account's most recent activity
      description: Trained fresh on every call from currently-consented users' activity — nothing is persisted between calls, so withdrawn consent is reflected immediately. Refuses to predict (returns null) if the only supporting evidence would come from fewer than the minimum number of distinct users, to avoid surfacing an individually-identifiable behavior pattern.
      responses:
        "200":
          description: Suggestion computed (or null if none clears the confidence/privacy threshold)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedActionResult"
        "403":
          description: MFA enrollment or parental consent required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai-security/report:
    get:
      operationId: getAiSecurityReport
      tags: [ai-security]
      summary: The team's AI/ML security proof-of-concept results, and the same attacks run against the live behaviour model
      description: >-
        `live` is computed on every call by running the attacks from artifacts/ai-model against the model behind
        GET /behavior/suggested-action, with synthetic data only (no database reads or writes). `poc` is the recorded
        output of the team's Python proof-of-concepts, regenerated by artifacts/ai-model/ai_security_report.py and
        checked for staleness in CI.
      responses:
        "200":
          description: Report computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSecurityReport"
        "403":
          description: MFA enrollment or parental consent required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/systems:
    get:
      operationId: getAiSystems
      tags: [ai-governance]
      summary: The AI system register — every place SecureAI uses AI, what it decides, who is accountable, and whether it is switched on
      description: Public, so the transparency page works before sign-in. Who switched a system off, and why, is only in the staff view (GET /ai/oversight).
      security: []
      responses:
        "200":
          description: The register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSystemsResponse"

  /ai/systems/{id}/state:
    put:
      operationId: setAiSystemState
      tags: [ai-governance]
      summary: Switch an AI system on or off (administrators only; recorded in the audit log with the reason)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            $ref: "#/components/schemas/AiSystemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAiSystemStateInput"
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSystemStaffState"
        "400":
          description: Invalid input, or this system cannot be switched off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrators only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/challenges:
    post:
      operationId: submitAiChallenge
      tags: [ai-governance]
      summary: Challenge an AI decision — reviewed by a security analyst
      description: Open to any signed-in account, including one that has not finished MFA setup, since a person the face model fails is exactly who needs this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChallengeInput"
      responses:
        "201":
          description: Challenge recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChallenge"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listAiChallenges
      tags: [ai-governance]
      summary: Every challenge, newest first (security analysts and administrators)
      responses:
        "200":
          description: Challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiChallenge"
        "403":
          description: Staff only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/challenges/mine:
    get:
      operationId: listMyAiChallenges
      tags: [ai-governance]
      summary: This account's own challenges and their outcomes
      responses:
        "200":
          description: Challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiChallenge"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/challenges/{id}/resolve:
    post:
      operationId: resolveAiChallenge
      tags: [ai-governance]
      summary: Record the outcome of a challenge (security analysts and administrators)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveAiChallengeInput"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChallenge"
        "404":
          description: No such challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/oversight:
    get:
      operationId: getAiOversight
      tags: [ai-governance]
      summary: Switch states with who changed them and why, outcome monitoring, and the open-challenge count (security analysts and administrators)
      responses:
        "200":
          description: Oversight view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiOversight"
        "403":
          description: Staff only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/content-personalization-consent:
    post:
      operationId: setContentPersonalizationConsent
      tags: [content-profile]
      summary: Opt in or out of having this account's own uploaded text content read to build a private personalization profile
      description: A third, distinct consent purpose from dataConsent and trainingConsent — see the User schema's contentPersonalizationConsentGiven field. Toggleable any time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetContentPersonalizationConsentInput"
      responses:
        "200":
          description: Consent state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/content-profile:
    get:
      operationId: getContentProfile
      tags: [content-profile]
      summary: A keyword-frequency personalization profile built from this account's own consented text uploads
      description: Computed fresh on every call from decrypted-in-memory text uploads — nothing is persisted, so withdrawn consent or a deleted upload is reflected immediately on the next call. Never pooled across accounts. Returns an empty profile (not an error) if consent isn't given or no text uploads exist yet.
      responses:
        "200":
          description: Profile computed (possibly empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentProfileResult"
        "403":
          description: MFA enrollment or parental consent required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List all payments
      responses:
        "200":
          description: Payments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a simulated payment (Stripe-style tokenisation)
      description: Simulates a real processor decision (lib/paymentSimulation.ts) rather than always succeeding — a known Stripe test-card last4 (via cardLast4 in the body) can simulate a realistic decline. Supports the Idempotency-Key header, standard practice for payment APIs — a retried request with the same key returns the original payment instead of creating a duplicate charge.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Optional client-generated key (e.g. a UUID) scoping this request as a single logical attempt. Retrying with the same key returns the original payment unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment created (or the original payment, if this Idempotency-Key was already used)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Simulated processor decline — see the payment's own declineCode/declineMessage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The account is on a payment hold after a lost chargeback; an admin must clear it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/{id}/refund:
    post:
      operationId: refundPayment
      tags: [payments]
      summary: Refund a completed payment
      description: Self-service within a 14-day window for the payment's own owner; admins can refund any completed payment regardless of age. Mirrors the same status transition a real payment.refunded webhook event would apply (routes/webhooks.ts), but attributed to a direct user/admin action rather than the (simulated) processor.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Payment refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: Not eligible for refund (wrong status, or outside the self-service window)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The payment is in, or was reversed by, a chargeback; or the account has used its self-service subscription refund for the year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get a payment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Payment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/plans:
    get:
      operationId: listPlans
      tags: [payments]
      summary: List available subscription plans (fixed, server-defined pricing)
      responses:
        "200":
          description: Plan catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /payments/subscribe:
    post:
      operationId: subscribe
      tags: [payments]
      summary: Subscribe to a plan — the server looks up the canonical price by planId, the client never sends an amount
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: Same semantics as POST /payments — retrying with the same key returns the original subscription payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeInput"
      responses:
        "201":
          description: Subscription payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Unknown plan or already subscribed to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The account is on a payment hold after a lost chargeback; an admin must clear it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/webhook:
    post:
      operationId: paymentWebhook
      tags: [payments]
      summary: Receive a signed payment-status update from the (simulated) payment provider
      description: HMAC-SHA256 signed via X-Webhook-Signature + X-Webhook-Timestamp headers (anti-replay window). Server-to-server — not session-authenticated, since a webhook caller has no browser session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhookInput"
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentWebhookResult"
        "401":
          description: Invalid, missing, or stale signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      summary: List the current user's uploaded files (metadata only, no content)
      responses:
        "200":
          description: Upload metadata list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadMeta"

    post:
      operationId: createUpload
      tags: [uploads]
      summary: Encrypt and store an uploaded text, image, or video file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "201":
          description: File encrypted and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadMeta"
        "400":
          description: Bad request (unsupported type, too large, or rejected by the virus scan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The virus scanner is configured but not answering, so the file was not stored. Retry-After gives the wait in seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/{id}:
    get:
      operationId: getUpload
      tags: [uploads]
      summary: Decrypt and return a file's content (owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Decrypted file content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadContent"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteUpload
      tags: [uploads]
      summary: Delete an uploaded file (owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "204":
          description: Upload deleted
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SetTrainingConsentInput:
      type: object
      required: [consent]
      properties:
        consent:
          type: boolean

    SetContentPersonalizationConsentInput:
      type: object
      required: [consent]
      properties:
        consent:
          type: boolean

    KeywordScore:
      type: object
      required: [keyword, score]
      properties:
        keyword:
          type: string
        score:
          description: Relative frequency within this account's own text-upload corpus — not a probability, not comparable across accounts
          type: number

    ContentProfileResult:
      type: object
      required: [keywords, documentsConsidered, disabled]
      properties:
        keywords:
          description: Top keywords by frequency, highest first. Empty if consent isn't given or no text uploads exist.
          type: array
          items:
            $ref: "#/components/schemas/KeywordScore"
        documentsConsidered:
          description: How many of this account's own text uploads contributed to this profile
          type: number
        disabled:
          description: True when an administrator has switched personalisation off (see GET /ai/systems)
          type: boolean

    SuggestedActionResult:
      type: object
      required: [suggestion, distinctUsersSupporting, modelTrainedFromUsers, contextDepth, disabled]
      properties:
        suggestion:
          description: Predicted next event type, or null if nothing cleared the minimum-distinct-users threshold (or the account has no activity yet)
          type: ["string", "null"]
        distinctUsersSupporting:
          description: How many distinct consented users' activity supports this specific prediction — 0 if suggestion is null
          type: number
        modelTrainedFromUsers:
          description: Total number of consented users the model was trained from on this call
          type: number
        contextDepth:
          description: Whether the prediction came from the 2-event context (2, more specific/accurate) or fell back to the single-last-event table (1). Null if suggestion is null.
          type: ["number", "null"]
          enum: [1, 2, null]
        disabled:
          description: True when an administrator has switched suggestions off (see GET /ai/systems)
          type: boolean

    User:
      type: object
      required: [id, email, name, role, faceEnrolled, passkeyEnrolled, dataConsentGiven, biometricConsentGiven, parentConsentPending, trainingConsentGiven, contentPersonalizationConsentGiven, subscriptionPlan, paymentHold, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [user, admin, security_analyst, it_support]
        faceEnrolled:
          type: boolean
        passkeyEnrolled:
          description: True when the account has at least one registered passkey
          type: boolean
        dataConsentGiven:
          description: General data-processing consent, captured at registration
          type: boolean
        biometricConsentGiven:
          description: Consent for biometric (face) data specifically — cleared whenever the stored face descriptor is deleted
          type: boolean
        parentConsentPending:
          description: True when this account was registered under the minor-consent age threshold and a parent/guardian has not yet confirmed via their emailed link — the account cannot use protected features until this clears
          type: boolean
        trainingConsentGiven:
          description: Separate from dataConsentGiven — whether this account's activity may contribute to the behavior model's training corpus. Toggleable any time, unlike dataConsentGiven.
          type: boolean
        contentPersonalizationConsentGiven:
          description: A third, distinct consent purpose — whether this account's own uploaded text content may be read (decrypted server-side) to build a private, never-pooled personalization profile. Separate from trainingConsentGiven, which only ever gates event-type behavioral training, never upload content. Toggleable any time via POST /users/me/content-personalization-consent.
          type: boolean
        subscriptionPlan:
          type: string
          enum: [free, plus, pro, team]
        paymentHold:
          description: True after the account lost a chargeback. New purchases are refused until an admin clears it.
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    UserRegistration:
      type: object
      required: [email, name, password, dataConsent, dateOfBirth]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        dataConsent:
          description: Must be true — explicit consent to processing of account/profile data. Registration is rejected without it.
          type: boolean
        dateOfBirth:
          description: Self-reported, ISO date (YYYY-MM-DD). Used server-side to compute age at registration — never trust a client-computed "is adult" boolean, same principle as everywhere else consent/verification is enforced in this app.
          type: string
        parentGuardianEmail:
          description: Required only when dateOfBirth indicates the registrant is under the minor-consent age threshold. Registration succeeds but the account is gated (parentConsentPending) until this address confirms via an emailed link.
          type: string
          format: email
          maxLength: 254
        trainingConsent:
          description: Optional, defaults to false if omitted. Separate from dataConsent — whether this account's activity may contribute to the behavior model's training corpus from day one. Not required to register, and freely togglable afterward via POST /users/me/training-consent regardless of what was chosen here.
          type: boolean
          default: false
        privacyPolicyVersion:
          description: The privacy policy version shown on the registration form. When it is the current version, the registration records that this person was shown it (PRIVACY_POLICY_ACKNOWLEDGED); otherwise they are asked to review the policy after signing in.
          type: string
          maxLength: 32

    LoginCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [requiresFaceVerification, faceAvailable, passkeyAvailable, user]
      properties:
        requiresFaceVerification:
          description: True when a second verification step (face or passkey) is required
          type: boolean
        faceAvailable:
          description: True when the user can complete MFA with a face scan
          type: boolean
        passkeyAvailable:
          description: True when the user can complete MFA with a device passkey
          type: boolean
        tempToken:
          type: ["string", "null"]
        user:
          $ref: "#/components/schemas/User"
        securityNotice:
          description: Set when the login-risk model flagged this attempt (new device/IP, or a rapid IP change on this account) — surfaced once, at the point risk is known, regardless of whether a second factor is also required next. Null on every ordinary login.
          type: ["string", "null"]

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
        devParentConsentLink:
          description: Only populated outside production, for a newly-registered minor account, where no email provider is configured — lets the demo be clicked through without a mail server.
          type: ["string", "null"]

    LogoutAllResult:
      type: object
      required: [terminatedSessions]
      properties:
        terminatedSessions:
          description: Number of session rows deleted, including the one making this request
          type: number

    FaceVerifyInput:
      type: object
      required: [descriptor, tempToken]
      properties:
        descriptor:
          type: array
          items:
            type: number
        tempToken:
          type: string

    FaceEnrollment:
      type: object
      required: [descriptor, consent]
      properties:
        descriptor:
          type: array
          items:
            type: number
        consent:
          description: Must be true — explicit consent to capturing and storing a biometric face template. Enrollment is rejected without it.
          type: boolean

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [user, admin, security_analyst, it_support]

    DeleteUserConfirmation:
      type: object
      properties:
        password:
          description: Required when deleting your own account (step-up re-authentication); ignored for admin-driven deletion of a different account
          type: string

    SecurityDashboard:
      type: object
      required: [totalUsers, faceEnrolledUsers, activeSessionsCount, loginAttempts24h, failedLogins24h, threatsDetected, recentLogs, activeAlerts]
      properties:
        totalUsers:
          type: number
        faceEnrolledUsers:
          type: number
        activeSessionsCount:
          type: number
        loginAttempts24h:
          type: number
        failedLogins24h:
          type: number
        threatsDetected:
          type: number
        recentLogs:
          type: array
          items:
            $ref: "#/components/schemas/SecurityLog"
        activeAlerts:
          description: Computed, not stored — recomputed on every dashboard request from recent security_logs activity. Empty for non-security_analyst roles, same visibility rule as recentLogs.
          type: array
          items:
            $ref: "#/components/schemas/SecurityAlert"

    SecurityAlert:
      type: object
      required: [id, severity, message, count, windowMinutes]
      properties:
        id:
          description: Stable, deterministic per alert kind + key (e.g. "rate-limit-spike:203.0.113.5") so the frontend can key a list without a persisted row
          type: string
        severity:
          type: string
          enum: [medium, high]
        message:
          type: string
        count:
          type: number
        windowMinutes:
          type: number

    SecurityLog:
      type: object
      required: [id, eventType, timestamp, details]
      properties:
        id:
          type: number
        userId:
          type: ["number", "null"]
        userEmail:
          type: ["string", "null"]
        eventType:
          type: string
        ipAddress:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
        details:
          type: string
        timestamp:
          type: string

    Threat:
      type: object
      required: [id, type, severity, description, timestamp, status]
      properties:
        id:
          type: number
        type:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        description:
          type: string
        plainSummary:
          description: A jargon-free explanation of what happened and why it matters, for a non-technical viewer of the same dashboard
          type: ["string", "null"]
        timestamp:
          type: string
        status:
          type: string
          enum: [active, mitigated, resolved]
        affectedUsers:
          type: ["number", "null"]

    LogChainVerification:
      type: object
      required: [valid, rowsChecked, brokenAtId, reason]
      properties:
        valid:
          type: boolean
        rowsChecked:
          type: number
        brokenAtId:
          type: ["number", "null"]
        reason:
          type: ["string", "null"]

    ChainRepairResult:
      type: object
      required: [repaired, removedCount, removedFromId, verification]
      properties:
        repaired:
          description: False if the chain was already valid — nothing was removed
          type: boolean
        removedCount:
          type: number
        removedFromId:
          type: ["number", "null"]
        verification:
          description: Re-verification result after the repair (or the original check, if nothing needed repairing)
          $ref: "#/components/schemas/LogChainVerification"

    ChainRestoreResult:
      type: object
      required: [restored, restoredCount, restoredIds, unrecoverableIds, verification]
      properties:
        restored:
          type: boolean
        restoredCount:
          type: number
        restoredIds:
          type: array
          items:
            type: number
        unrecoverableIds:
          description: Ids confirmed missing but with no deletion-audit snapshot to restore from
          type: array
          items:
            type: number
        verification:
          description: Re-verification result after restoring (or the original check, if nothing needed restoring)
          $ref: "#/components/schemas/LogChainVerification"

    DeletionAuditEntry:
      type: object
      required: [id, deletedLogId, eventType, details, deletedByAppActor, deletedByDbRole, deletedByClientAddr, deletedAt, currentlyRestored]
      properties:
        id:
          type: number
        deletedLogId:
          description: The security_logs id that was deleted
          type: number
        eventType:
          type: ["string", "null"]
        details:
          type: ["string", "null"]
        deletedByAppActor:
          description: Set only for app-initiated deletions (e.g. repairLogChain) — null means raw/out-of-band, such as a direct SQL client
          type: ["string", "null"]
        deletedByDbRole:
          type: string
        deletedByClientAddr:
          type: ["string", "null"]
        deletedAt:
          type: string
        currentlyRestored:
          description: Whether a row now sits at this id again (e.g. restored via restoreLogChain)
          type: boolean

    Payment:
      type: object
      required: [id, userId, amount, currency, status, description, providerToken, createdAt]
      properties:
        id:
          type: number
        userId:
          description: Null if the owning account has since been deleted — the payment record is retained (userEmail preserves who it was), the account is not.
          type: ["number", "null"]
        userEmail:
          type: ["string", "null"]
        amount:
          type: number
        currency:
          type: string
        status:
          description: disputed = the cardholder opened a chargeback; charged_back = the dispute was lost and the money returned to them
          type: string
          enum: [pending, completed, failed, refunded, disputed, charged_back]
        description:
          type: string
        planId:
          description: The plan a subscription payment bought; null for one-off payments. Reversing the payment takes the plan back.
          type: ["string", "null"]
        declineCode:
          description: Set only when status is "failed" — see lib/paymentSimulation.ts. Null otherwise.
          type: ["string", "null"]
        declineMessage:
          description: A user-facing explanation of the decline. Null unless status is "failed".
          type: ["string", "null"]
        providerToken:
          type: string
        createdAt:
          type: string

    PaymentInput:
      type: object
      required: [amount, currency, description]
      properties:
        amount:
          description: No real payment processor is behind this demo endpoint, so there's no upstream cap enforcing a sane ceiling the way a real processor would — this one is Team 1's own, not a business decision to defer.
          type: number
          minimum: 0.01
          maximum: 999999.99
        currency:
          description: Restricted to the currencies this app actually prices plans in, not just "any 3 letters" — a real ISO-4217 registry check is out of scope for a demo, but "looks like a real currency" is not.
          type: string
          enum: [USD, EUR, GBP, AUD, CAD]
        description:
          type: string
          minLength: 1
        cardLast4:
          description: Optional. The last 4 digits only — never the full card number, expiry, or CVV, which never leave the browser (see cardValidation.ts). Used purely to drive the simulated processor's decline logic (lib/paymentSimulation.ts) against Stripe's own published test-card numbers; omitting it always simulates success.
          type: ["string", "null"]
          pattern: "^\\d{4}$"
        cardBrand:
          description: Optional, display-only — e.g. "Visa", "Mastercard". Not itself sensitive (a standard, publicly documented numbering scheme).
          type: ["string", "null"]

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ForgotPasswordResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
        devResetLink:
          description: Only populated outside production, where no email provider is configured — lets the demo be clicked through without a mail server.
          type: ["string", "null"]

    VerifyParentConsentInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1

    VerifyParentConsentResult:
      type: object
      required: [verified]
      properties:
        verified:
          type: boolean
        childEmail:
          description: The account's own email, shown as confirmation of which account this approved
          type: ["string", "null"]

    VerifyResetTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1

    VerifyResetTokenResult:
      type: object
      required: [faceAvailable, passkeyAvailable]
      properties:
        faceAvailable:
          description: True when the account has an enrolled face descriptor to verify against
          type: boolean
        passkeyAvailable:
          description: True when the account has at least one registered passkey
          type: boolean

    ResetPasswordFaceInput:
      type: object
      required: [token, descriptor, newPassword]
      properties:
        token:
          type: string
          minLength: 1
        descriptor:
          type: array
          items:
            type: number
        newPassword:
          type: string
          minLength: 8

    ResetPasswordResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    Plan:
      type: object
      required: [id, name, amount, currency, interval, description, features]
      properties:
        id:
          type: string
          enum: [plus, pro, team]
        name:
          type: string
        amount:
          type: number
        currency:
          type: string
        interval:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            type: string

    SubscribeInput:
      type: object
      required: [planId]
      properties:
        planId:
          description: One of the Plan.id values from GET /payments/plans — never a client-supplied amount
          type: string
          minLength: 1
        cardLast4:
          description: Optional, same simulated-decline purpose as PaymentInput.cardLast4 — omit to always simulate success.
          type: ["string", "null"]
          pattern: "^\\d{4}$"
        cardBrand:
          type: ["string", "null"]

    SubscribeResult:
      type: object
      required: [payment, subscriptionPlan]
      properties:
        payment:
          $ref: "#/components/schemas/Payment"
        subscriptionPlan:
          type: string
          enum: [free, plus, pro, team]

    PrivacyPolicyStatus:
      type: object
      required: [currentVersion, acknowledgedVersion, acknowledgedAt]
      properties:
        currentVersion:
          type: string
        acknowledgedVersion:
          description: The latest version this account was recorded as having been shown, or null
          type: ["string", "null"]
        acknowledgedAt:
          type: ["string", "null"]

    PrivacyPolicyAcknowledgeInput:
      type: object
      required: [version]
      properties:
        version:
          type: string
          maxLength: 32

    DataExport:
      description: A personal data export. Its sections are described in the file's own notes field.
      type: object
      additionalProperties: true

    PaymentWebhookInput:
      type: object
      required: [type, paymentId]
      properties:
        type:
          type: string
          enum: [payment.completed, payment.failed, payment.refunded, payment.disputed, payment.dispute_won, payment.dispute_lost]
        paymentId:
          type: number

    PaymentWebhookResult:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
        applied:
          description: False when the event was a replay or out of order for the payment's current status, and changed nothing
          type: boolean

    UploadMeta:
      type: object
      required: [id, userId, fileName, mimeType, fileType, sizeBytes, createdAt, contentSource, trainingEligible]
      properties:
        id:
          type: number
        userId:
          type: number
        fileName:
          type: string
        mimeType:
          type: string
        fileType:
          type: string
          enum: [image, video, text, audio]
        sizeBytes:
          type: number
        createdAt:
          type: string
        contentSource:
          description: >-
            Declared origin of the file's content, per Team 2's Data Source
            Acceptability Matrix. "unspecified" is the fail-closed default for
            an upload that never declared one.
          type: string
          enum: [own_work, third_party_individual, published_work, social_media, incidental_third_party_ip, unspecified]
        trainingEligible:
          description: >-
            Whether the matrix admits this file into a training corpus, given
            its source and file type together. Returned so the consequence of
            a provenance declaration is visible to the uploader rather than
            only enforced server-side.
          type: boolean
        trainingExclusionReason:
          description: Present only when trainingEligible is false; the matrix's own reasoning.
          type: string

    UploadContent:
      type: object
      required: [id, userId, fileName, mimeType, fileType, sizeBytes, createdAt, dataBase64]
      properties:
        id:
          type: number
        userId:
          type: number
        fileName:
          type: string
        mimeType:
          type: string
        fileType:
          type: string
          enum: [image, video, text, audio]
        sizeBytes:
          type: number
        createdAt:
          type: string
        dataBase64:
          description: Decrypted file content, base64-encoded
          type: string

    UploadInput:
      type: object
      required: [fileName, mimeType, dataBase64]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
        dataBase64:
          description: Raw file bytes, base64-encoded
          type: string
          minLength: 1
        contentSource:
          description: >-
            Declared origin of the content, per Team 2's Data Source
            Acceptability Matrix. Optional: omitting it stores the upload as
            "unspecified", which keeps the file fully usable by its owner but
            excludes it from every training corpus until a source is declared.
          type: string
          enum: [own_work, third_party_individual, published_work, social_media, incidental_third_party_ip, unspecified]
    AiSecurityReport:
      type: object
      required: [live, poc]
      properties:
        live:
          $ref: "#/components/schemas/AiLiveModelValidation"
        poc:
          $ref: "#/components/schemas/AiPocReport"
    AiLiveModelValidation:
      type: object
      required: [ranAt, model, thresholds, tests]
      properties:
        ranAt:
          type: string
          format: date-time
        model:
          type: string
        thresholds:
          type: object
          required: [minDistinctUsers, maxEventsPerUser, maxDistinctTransitionsPerUser]
          properties:
            minDistinctUsers:
              type: number
            maxEventsPerUser:
              type: number
            maxDistinctTransitionsPerUser:
              type: number
        tests:
          type: array
          items:
            $ref: "#/components/schemas/AiValidationTest"
    AiValidationOutcome:
      type: object
      required: [outcome, compromised]
      properties:
        outcome:
          type: string
        compromised:
          type: boolean
    AiValidationTest:
      type: object
      required: [id, title, mirrors, attack, baseline, secureai, probes, verdict, note]
      properties:
        id:
          type: string
        title:
          type: string
        mirrors:
          description: Which teammate's proof-of-concept attack this reproduces
          type: string
        attack:
          type: string
        baseline:
          description: The same attack against the model with the defence removed; null where there is no meaningful undefended comparison
          anyOf:
            - $ref: "#/components/schemas/AiValidationOutcome"
            - type: "null"
        secureai:
          $ref: "#/components/schemas/AiValidationOutcome"
        probes:
          type: array
          items:
            type: object
            required: [prompt, baselineOutput, secureaiOutput]
            properties:
              prompt:
                type: string
              baselineOutput:
                type: ["string", "null"]
              secureaiOutput:
                type: ["string", "null"]
        verdict:
          type: string
          enum: [held, residual]
        note:
          type: ["string", "null"]
    AiPocModelRun:
      type: object
      required: [prompt, output, canaryLeaked]
      properties:
        prompt:
          type: string
        output:
          type: string
        canaryLeaked:
          type: boolean
    AiPocReport:
      type: object
      required: [generator, starterKit, memorisation]
      properties:
        generator:
          type: string
        starterKit:
          $ref: "#/components/schemas/AiPocStarterKit"
        memorisation:
          $ref: "#/components/schemas/AiPocMemorisation"
    AiPocStarterKit:
      description: Yaseen's model_starter.py, run unmodified
      type: object
      required: [script, author, sha256, corpus, consentGate, vulnerable, hardened, extractionTests, benign, deletion, console]
      properties:
        script:
          type: string
        author:
          type: string
        sha256:
          type: string
        corpus:
          type: object
          required: [records, canaryCopies, traceabilityFields]
          properties:
            records:
              type: number
            canaryCopies:
              type: number
            traceabilityFields:
              type: array
              items:
                type: string
        consentGate:
          type: object
          required: [allowed, blocked, perUserCap]
          properties:
            allowed:
              type: number
            blocked:
              type: array
              items:
                type: object
                required: [userId, sourceId, reason]
                properties:
                  userId:
                    type: string
                  sourceId:
                    type: string
                  reason:
                    type: string
            perUserCap:
              type: number
        vulnerable:
          type: object
          required: [docs, prompt, output, canaryLeaked]
          properties:
            docs:
              type: number
            prompt:
              type: string
            output:
              type: string
            canaryLeaked:
              type: boolean
        hardened:
          type: object
          required: [duplicatesRemoved, prompt, output, canaryLeaked]
          properties:
            duplicatesRemoved:
              type: number
            prompt:
              type: string
            output:
              type: string
            canaryLeaked:
              type: boolean
        extractionTests:
          type: array
          items:
            type: object
            required: [prompt, vulnerableLeaked, hardenedLeaked]
            properties:
              prompt:
                type: string
              vulnerableLeaked:
                type: boolean
              hardenedLeaked:
                type: boolean
        benign:
          type: object
          required: [prompt, output]
          properties:
            prompt:
              type: string
            output:
              type: string
        deletion:
          type: object
          required: [userId, recordsBefore, recordsAfter, retrainedDocs]
          properties:
            userId:
              type: string
            recordsBefore:
              type: number
            recordsAfter:
              type: number
            retrainedDocs:
              type: number
        console:
          description: The script's own console output, captured verbatim
          type: string
    AiPocMemorisation:
      description: Sadhakshi's memorisation_leakage_model.py, run unmodified
      type: object
      required: [script, author, sha256, records, vulnerable, duplicatesRemoved, hardened, benign, verdict, console]
      properties:
        script:
          type: string
        author:
          type: string
        sha256:
          type: string
        records:
          type: number
        vulnerable:
          $ref: "#/components/schemas/AiPocModelRun"
        duplicatesRemoved:
          type: number
        hardened:
          $ref: "#/components/schemas/AiPocModelRun"
        benign:
          type: object
          required: [prompt, output, works]
          properties:
            prompt:
              type: string
            output:
              type: string
            works:
              type: boolean
        verdict:
          type: string
          enum: [PASS, REVIEW]
        console:
          description: The script's own console output, captured verbatim
          type: string
    AiSystemId:
      type: string
      enum: [face-recognition, liveness, login-risk, behaviour-suggestions, content-personalisation, anomaly-alerts]
    AiSystemEntry:
      type: object
      required: [id, name, kind, purpose, whyAi, decides, dataUsed, runsWhere, humanOversight, howToChallenge, knownLimits, riskRefs, accountableOwner, oversightRole, switchable, switchNote, enabled, stateChangedAt]
      properties:
        id:
          $ref: "#/components/schemas/AiSystemId"
        name:
          type: string
        kind:
          type: string
        purpose:
          type: string
        whyAi:
          type: string
        decides:
          type: string
        dataUsed:
          type: string
        runsWhere:
          type: string
        humanOversight:
          type: string
        howToChallenge:
          type: string
        knownLimits:
          type: array
          items:
            type: string
        riskRefs:
          type: array
          items:
            type: string
        accountableOwner:
          type: string
        oversightRole:
          type: string
        switchable:
          type: boolean
        switchNote:
          type: string
        enabled:
          type: boolean
        stateChangedAt:
          type: ["string", "null"]
          format: date-time
    AiSystemsResponse:
      type: object
      required: [accountableOwner, systems]
      properties:
        accountableOwner:
          type: string
        systems:
          type: array
          items:
            $ref: "#/components/schemas/AiSystemEntry"
    SetAiSystemStateInput:
      type: object
      required: [enabled, reason]
      properties:
        enabled:
          type: boolean
        reason:
          description: Why — recorded in the audit log
          type: string
          minLength: 10
          maxLength: 500
    AiSystemStaffState:
      type: object
      required: [id, name, switchable, switchNote, enabled, changedAt, changedBy, reason]
      properties:
        id:
          $ref: "#/components/schemas/AiSystemId"
        name:
          type: string
        switchable:
          type: boolean
        switchNote:
          type: string
        enabled:
          type: boolean
        changedAt:
          type: ["string", "null"]
          format: date-time
        changedBy:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
    AiChallengeInput:
      type: object
      required: [systemId, message]
      properties:
        systemId:
          $ref: "#/components/schemas/AiSystemId"
        message:
          description: What the AI decided and why you think it was wrong
          type: string
          minLength: 10
          maxLength: 1000
        reference:
          description: Optional pointer to the decision, e.g. the date and time of the sign-in
          type: string
          maxLength: 120
          pattern: "^[A-Za-z0-9 _:.,/-]*$"
    ResolveAiChallengeInput:
      type: object
      required: [outcome, note]
      properties:
        outcome:
          type: string
          enum: [upheld, not-upheld]
        note:
          description: What was found and done — shown to the person who raised it
          type: string
          minLength: 5
          maxLength: 1000
    AiChallenge:
      type: object
      required: [id, systemId, systemName, reference, message, submittedAt, submittedBy, status, outcome, resolutionNote, resolvedAt, resolvedBy]
      properties:
        id:
          type: number
        systemId:
          $ref: "#/components/schemas/AiSystemId"
        systemName:
          type: string
        reference:
          type: ["string", "null"]
        message:
          type: string
        submittedAt:
          type: string
          format: date-time
        submittedBy:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, resolved]
        outcome:
          type: ["string", "null"]
          enum: [upheld, not-upheld, null]
        resolutionNote:
          type: ["string", "null"]
        resolvedAt:
          type: ["string", "null"]
          format: date-time
        resolvedBy:
          type: ["string", "null"]
    AiOutcomeWindow:
      type: object
      required: [days, faceScans, faceScanFailures, passwordSignIns, signInsFlagged, suggestionQueries, suggestionsShown, profileQueries, securityAlerts, challengesFiled]
      properties:
        days:
          type: number
        faceScans:
          type: number
        faceScanFailures:
          type: number
        passwordSignIns:
          type: number
        signInsFlagged:
          type: number
        suggestionQueries:
          type: number
        suggestionsShown:
          type: number
        profileQueries:
          type: number
        securityAlerts:
          type: number
        challengesFiled:
          type: number
    AiOversight:
      type: object
      required: [systems, outcomes, openChallenges]
      properties:
        systems:
          type: array
          items:
            $ref: "#/components/schemas/AiSystemStaffState"
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/AiOutcomeWindow"
        openChallenges:
          type: number
