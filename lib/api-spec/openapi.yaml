openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SecureAI - Biometric Security Demo API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: security
    description: Security monitoring
  - name: payments
    description: Payment operations
  - name: uploads
    description: Encrypted file uploads (text, image, video)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login step 1 - email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Login step 1 successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/face-verify:
    post:
      operationId: faceVerify
      tags: [auth]
      summary: Login step 2 - biometric face verification MFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaceVerifyInput"
      responses:
        "200":
          description: Face verification successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Face verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link
      description: Always returns the same response whether or not the email is registered, to avoid leaking account existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Reset link issued if the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResult"

  /auth/reset-password/verify:
    post:
      operationId: verifyResetToken
      tags: [auth]
      summary: Check a reset token and report which biometric/passkey second factors are available
      description: A reset link alone is not enough to change the password — the account's face or passkey must also verify, same as login MFA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyResetTokenInput"
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResetTokenResult"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password/face:
    post:
      operationId: resetPasswordWithFace
      tags: [auth]
      summary: Complete a password reset by matching a live face scan against the enrolled descriptor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordFaceInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResult"
        "400":
          description: Invalid/expired token or malformed face data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Face did not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout current session
      responses:
        "204":
          description: Logged out successfully

  /auth/logout-all:
    post:
      operationId: logoutAllDevices
      tags: [auth]
      summary: Sign out of every device — session revocation
      description: Deletes every persisted session belonging to this account, not just the current one. Addresses the "device theft while unlocked" scenario — a stolen device with a valid session can be locked out from any other device, without needing to change the password.
      responses:
        "200":
          description: All sessions terminated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutAllResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin or it_support)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user — self-service ("delete my profile") or admin-driven
      description: Self-deletion is step-up authenticated — the account's current password must be re-submitted even though the session is already logged in, since account deletion shouldn't be completable by anyone who merely has access to an already-unlocked session. Not required when an admin deletes a different account.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserConfirmation"
      responses:
        "204":
          description: User deleted
        "401":
          description: Password re-verification failed (self-delete only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/enroll-face:
    post:
      operationId: enrollFace
      tags: [users]
      summary: Enroll face biometric for a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaceEnrollment"
      responses:
        "200":
          description: Face enrolled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid face data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/face:
    delete:
      operationId: removeFace
      tags: [users]
      summary: Remove face enrollment for a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Face enrollment removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/reset-mfa:
    post:
      operationId: resetUserMfa
      tags: [users]
      summary: Force-clear a user's face + passkey enrollment (admin or it_support only)
      description: Clears the stored face descriptor and deletes every enrolled passkey for the account, so the user is routed back through /enroll. For unblocking a locked-out user who lost their device/face access — not a self-service action.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: MFA enrollment cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: Admin or it_support access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/reset-password:
    post:
      operationId: staffResetPassword
      tags: [users]
      summary: Issue a password reset link on behalf of a user (admin or it_support only)
      description: Same single-use, time-limited token mechanism as self-service /auth/forgot-password — no email provider is configured for this demo, so the link is returned directly outside production.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Reset link issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResult"
        "403":
          description: Admin or it_support access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /security/dashboard:
    get:
      operationId: getSecurityDashboard
      tags: [security]
      summary: Get security dashboard statistics
      responses:
        "200":
          description: Security dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityDashboard"

  /security/logs:
    get:
      operationId: listSecurityLogs
      tags: [security]
      summary: List security audit logs
      parameters:
        - in: query
          name: limit
          schema:
            type: number
            default: 50
        - in: query
          name: offset
          schema:
            type: number
            default: 0
        - in: query
          name: eventType
          schema:
            type: string
        - in: query
          name: userEmail
          description: Case-insensitive partial match against the actor's email
          schema:
            type: string
        - in: query
          name: ipAddress
          description: Case-insensitive partial match against the request's origin IP
          schema:
            type: string
        - in: query
          name: fromDate
          description: ISO 8601 timestamp — only logs at or after this time
          schema:
            type: string
        - in: query
          name: toDate
          description: ISO 8601 timestamp — only logs at or before this time
          schema:
            type: string
      responses:
        "200":
          description: Security logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityLog"

  /security/threats:
    get:
      operationId: listThreats
      tags: [security]
      summary: List threat assessments
      responses:
        "200":
          description: Threat assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Threat"

  /security/logs/verify:
    get:
      operationId: verifyLogIntegrity
      tags: [security]
      summary: Recompute the audit log hash chain and report whether it's intact (admin only)
      responses:
        "200":
          description: Chain verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogChainVerification"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List all payments
      responses:
        "200":
          description: Payments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a simulated payment (Stripe-style tokenisation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get a payment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Payment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/plans:
    get:
      operationId: listPlans
      tags: [payments]
      summary: List available subscription plans (fixed, server-defined pricing)
      responses:
        "200":
          description: Plan catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /payments/subscribe:
    post:
      operationId: subscribe
      tags: [payments]
      summary: Subscribe to a plan — the server looks up the canonical price by planId, the client never sends an amount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeInput"
      responses:
        "201":
          description: Subscription payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Unknown plan or already subscribed to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/webhook:
    post:
      operationId: paymentWebhook
      tags: [payments]
      summary: Receive a signed payment-status update from the (simulated) payment provider
      description: HMAC-SHA256 signed via X-Webhook-Signature + X-Webhook-Timestamp headers (anti-replay window). Server-to-server — not session-authenticated, since a webhook caller has no browser session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhookInput"
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentWebhookResult"
        "401":
          description: Invalid, missing, or stale signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      summary: List the current user's uploaded files (metadata only, no content)
      responses:
        "200":
          description: Upload metadata list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadMeta"

    post:
      operationId: createUpload
      tags: [uploads]
      summary: Encrypt and store an uploaded text, image, or video file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "201":
          description: File encrypted and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadMeta"
        "400":
          description: Bad request (unsupported type or too large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/{id}:
    get:
      operationId: getUpload
      tags: [uploads]
      summary: Decrypt and return a file's content (owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Decrypted file content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadContent"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteUpload
      tags: [uploads]
      summary: Delete an uploaded file (owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Upload deleted
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    User:
      type: object
      required: [id, email, name, role, faceEnrolled, passkeyEnrolled, dataConsentGiven, biometricConsentGiven, subscriptionPlan, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [user, admin, security_analyst, it_support]
        faceEnrolled:
          type: boolean
        passkeyEnrolled:
          description: True when the account has at least one registered passkey
          type: boolean
        dataConsentGiven:
          description: General data-processing consent, captured at registration
          type: boolean
        biometricConsentGiven:
          description: Consent for biometric (face) data specifically — cleared whenever the stored face descriptor is deleted
          type: boolean
        subscriptionPlan:
          type: string
          enum: [free, plus, pro, team]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    UserRegistration:
      type: object
      required: [email, name, password, dataConsent]
      properties:
        email:
          type: string
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        dataConsent:
          description: Must be true — explicit consent to processing of account/profile data. Registration is rejected without it.
          type: boolean

    LoginCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [requiresFaceVerification, faceAvailable, passkeyAvailable, user]
      properties:
        requiresFaceVerification:
          description: True when a second verification step (face or passkey) is required
          type: boolean
        faceAvailable:
          description: True when the user can complete MFA with a face scan
          type: boolean
        passkeyAvailable:
          description: True when the user can complete MFA with a device passkey
          type: boolean
        tempToken:
          type: ["string", "null"]
        user:
          $ref: "#/components/schemas/User"

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    LogoutAllResult:
      type: object
      required: [terminatedSessions]
      properties:
        terminatedSessions:
          description: Number of session rows deleted, including the one making this request
          type: number

    FaceVerifyInput:
      type: object
      required: [descriptor, tempToken]
      properties:
        descriptor:
          type: array
          items:
            type: number
        tempToken:
          type: string

    FaceEnrollment:
      type: object
      required: [descriptor, consent]
      properties:
        descriptor:
          type: array
          items:
            type: number
        consent:
          description: Must be true — explicit consent to capturing and storing a biometric face template. Enrollment is rejected without it.
          type: boolean

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [user, admin, security_analyst, it_support]

    DeleteUserConfirmation:
      type: object
      properties:
        password:
          description: Required when deleting your own account (step-up re-authentication); ignored for admin-driven deletion of a different account
          type: string

    SecurityDashboard:
      type: object
      required: [totalUsers, faceEnrolledUsers, activeSessionsCount, loginAttempts24h, failedLogins24h, threatsDetected, recentLogs]
      properties:
        totalUsers:
          type: number
        faceEnrolledUsers:
          type: number
        activeSessionsCount:
          type: number
        loginAttempts24h:
          type: number
        failedLogins24h:
          type: number
        threatsDetected:
          type: number
        recentLogs:
          type: array
          items:
            $ref: "#/components/schemas/SecurityLog"

    SecurityLog:
      type: object
      required: [id, eventType, timestamp, details]
      properties:
        id:
          type: number
        userId:
          type: ["number", "null"]
        userEmail:
          type: ["string", "null"]
        eventType:
          type: string
        ipAddress:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
        details:
          type: string
        timestamp:
          type: string

    Threat:
      type: object
      required: [id, type, severity, description, timestamp, status]
      properties:
        id:
          type: number
        type:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        description:
          type: string
        plainSummary:
          description: A jargon-free explanation of what happened and why it matters, for a non-technical viewer of the same dashboard
          type: ["string", "null"]
        timestamp:
          type: string
        status:
          type: string
          enum: [active, mitigated, resolved]
        affectedUsers:
          type: ["number", "null"]

    LogChainVerification:
      type: object
      required: [valid, rowsChecked, brokenAtId, reason]
      properties:
        valid:
          type: boolean
        rowsChecked:
          type: number
        brokenAtId:
          type: ["number", "null"]
        reason:
          type: ["string", "null"]

    Payment:
      type: object
      required: [id, userId, amount, currency, status, description, providerToken, createdAt]
      properties:
        id:
          type: number
        userId:
          description: Null if the owning account has since been deleted — the payment record is retained (userEmail preserves who it was), the account is not.
          type: ["number", "null"]
        userEmail:
          type: ["string", "null"]
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        description:
          type: string
        providerToken:
          type: string
        createdAt:
          type: string

    PaymentInput:
      type: object
      required: [amount, currency, description]
      properties:
        amount:
          type: number
          minimum: 0.01
        currency:
          type: string
          minLength: 3
          maxLength: 3
        description:
          type: string
          minLength: 1

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ForgotPasswordResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
        devResetLink:
          description: Only populated outside production, where no email provider is configured — lets the demo be clicked through without a mail server.
          type: ["string", "null"]

    VerifyResetTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1

    VerifyResetTokenResult:
      type: object
      required: [faceAvailable, passkeyAvailable]
      properties:
        faceAvailable:
          description: True when the account has an enrolled face descriptor to verify against
          type: boolean
        passkeyAvailable:
          description: True when the account has at least one registered passkey
          type: boolean

    ResetPasswordFaceInput:
      type: object
      required: [token, descriptor, newPassword]
      properties:
        token:
          type: string
          minLength: 1
        descriptor:
          type: array
          items:
            type: number
        newPassword:
          type: string
          minLength: 8

    ResetPasswordResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    Plan:
      type: object
      required: [id, name, amount, currency, interval, description, features]
      properties:
        id:
          type: string
          enum: [plus, pro, team]
        name:
          type: string
        amount:
          type: number
        currency:
          type: string
        interval:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            type: string

    SubscribeInput:
      type: object
      required: [planId]
      properties:
        planId:
          description: One of the Plan.id values from GET /payments/plans — never a client-supplied amount
          type: string
          minLength: 1

    SubscribeResult:
      type: object
      required: [payment, subscriptionPlan]
      properties:
        payment:
          $ref: "#/components/schemas/Payment"
        subscriptionPlan:
          type: string
          enum: [free, plus, pro, team]

    PaymentWebhookInput:
      type: object
      required: [type, paymentId]
      properties:
        type:
          type: string
          enum: [payment.completed, payment.failed, payment.refunded]
        paymentId:
          type: number

    PaymentWebhookResult:
      type: object
      required: [received]
      properties:
        received:
          type: boolean

    UploadMeta:
      type: object
      required: [id, userId, fileName, mimeType, fileType, sizeBytes, createdAt]
      properties:
        id:
          type: number
        userId:
          type: number
        fileName:
          type: string
        mimeType:
          type: string
        fileType:
          type: string
          enum: [image, video, text, audio]
        sizeBytes:
          type: number
        createdAt:
          type: string

    UploadContent:
      type: object
      required: [id, userId, fileName, mimeType, fileType, sizeBytes, createdAt, dataBase64]
      properties:
        id:
          type: number
        userId:
          type: number
        fileName:
          type: string
        mimeType:
          type: string
        fileType:
          type: string
          enum: [image, video, text, audio]
        sizeBytes:
          type: number
        createdAt:
          type: string
        dataBase64:
          description: Decrypted file content, base64-encoded
          type: string

    UploadInput:
      type: object
      required: [fileName, mimeType, dataBase64]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          minLength: 1
        dataBase64:
          description: Raw file bytes, base64-encoded
          type: string
          minLength: 1
