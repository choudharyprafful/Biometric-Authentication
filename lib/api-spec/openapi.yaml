openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SecureAI - Biometric Security Demo API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: security
    description: Security monitoring
  - name: payments
    description: Payment operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login step 1 - email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Login step 1 successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/face-verify:
    post:
      operationId: faceVerify
      tags: [auth]
      summary: Login step 2 - biometric face verification MFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaceVerifyInput"
      responses:
        "200":
          description: Face verification successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Face verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout current session
      responses:
        "204":
          description: Logged out successfully

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: User deleted
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/enroll-face:
    post:
      operationId: enrollFace
      tags: [users]
      summary: Enroll face biometric for a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaceEnrollment"
      responses:
        "200":
          description: Face enrolled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid face data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/face:
    delete:
      operationId: removeFace
      tags: [users]
      summary: Remove face enrollment for a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Face enrollment removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /security/dashboard:
    get:
      operationId: getSecurityDashboard
      tags: [security]
      summary: Get security dashboard statistics
      responses:
        "200":
          description: Security dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityDashboard"

  /security/logs:
    get:
      operationId: listSecurityLogs
      tags: [security]
      summary: List security audit logs
      parameters:
        - in: query
          name: limit
          schema:
            type: number
            default: 50
        - in: query
          name: offset
          schema:
            type: number
            default: 0
        - in: query
          name: eventType
          schema:
            type: string
      responses:
        "200":
          description: Security logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityLog"

  /security/threats:
    get:
      operationId: listThreats
      tags: [security]
      summary: List threat assessments
      responses:
        "200":
          description: Threat assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Threat"

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List all payments
      responses:
        "200":
          description: Payments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a simulated payment (Stripe-style tokenisation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/webauthn/register-options:
    post:
      operationId: webauthnRegisterOptions
      tags: [auth]
      summary: Generate passkey registration options (step 1)
      responses:
        "200":
          description: Registration options for the browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/webauthn/register-verify:
    post:
      operationId: webauthnRegisterVerify
      tags: [auth]
      summary: Verify passkey registration and save credential (step 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnRegisterVerifyInput"
      responses:
        "200":
          description: Registration verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnRegisterResult"
        "400":
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/webauthn/authenticate-options:
    post:
      operationId: webauthnAuthenticateOptions
      tags: [auth]
      summary: Generate passkey authentication options (step 1)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAuthOptionsInput"
      responses:
        "200":
          description: Authentication options for the browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"

  /auth/webauthn/authenticate-verify:
    post:
      operationId: webauthnAuthenticateVerify
      tags: [auth]
      summary: Verify passkey assertion and establish session (step 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAuthVerifyInput"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/webauthn/credentials:
    get:
      operationId: listPasskeys
      tags: [auth]
      summary: List registered passkeys for current user
      responses:
        "200":
          description: List of passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasskeyInfo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/webauthn/credentials/{id}:
    delete:
      operationId: deletePasskey
      tags: [auth]
      summary: Remove a registered passkey
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Passkey removed
        "404":
          description: Passkey not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get a payment by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Payment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    User:
      type: object
      required: [id, email, name, role, faceEnrolled, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
        faceEnrolled:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    UserRegistration:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8

    LoginCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [requiresFaceVerification, user]
      properties:
        requiresFaceVerification:
          type: boolean
        tempToken:
          type: ["string", "null"]
        user:
          $ref: "#/components/schemas/User"

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    FaceVerifyInput:
      type: object
      required: [descriptor, tempToken]
      properties:
        descriptor:
          type: array
          items:
            type: number
        tempToken:
          type: string

    FaceEnrollment:
      type: object
      required: [descriptor]
      properties:
        descriptor:
          type: array
          items:
            type: number

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [user, admin]

    SecurityDashboard:
      type: object
      required: [totalUsers, faceEnrolledUsers, activeSessionsCount, loginAttempts24h, failedLogins24h, threatsDetected, recentLogs]
      properties:
        totalUsers:
          type: number
        faceEnrolledUsers:
          type: number
        activeSessionsCount:
          type: number
        loginAttempts24h:
          type: number
        failedLogins24h:
          type: number
        threatsDetected:
          type: number
        recentLogs:
          type: array
          items:
            $ref: "#/components/schemas/SecurityLog"

    SecurityLog:
      type: object
      required: [id, eventType, timestamp, details]
      properties:
        id:
          type: number
        userId:
          type: ["number", "null"]
        userEmail:
          type: ["string", "null"]
        eventType:
          type: string
        ipAddress:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
        details:
          type: string
        timestamp:
          type: string

    Threat:
      type: object
      required: [id, type, severity, description, timestamp, status]
      properties:
        id:
          type: number
        type:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        description:
          type: string
        timestamp:
          type: string
        status:
          type: string
          enum: [active, mitigated, resolved]
        affectedUsers:
          type: ["number", "null"]

    Payment:
      type: object
      required: [id, userId, amount, currency, status, description, providerToken, createdAt]
      properties:
        id:
          type: number
        userId:
          type: number
        userEmail:
          type: ["string", "null"]
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        description:
          type: string
        providerToken:
          type: string
        createdAt:
          type: string

    WebAuthnOptions:
      type: object
      description: >
        PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON
        returned by SimpleWebAuthn. Pass this directly to startRegistration() or
        startAuthentication() in @simplewebauthn/browser.
      additionalProperties: true
      required: [challenge]
      properties:
        challenge:
          type: string

    WebAuthnRegisterVerifyInput:
      type: object
      required: [response]
      properties:
        response:
          type: object
          description: RegistrationResponseJSON from startRegistration()
          additionalProperties: true
        label:
          type: string
          description: Human-readable name for this passkey (e.g. "MacBook Touch ID")

    WebAuthnRegisterResult:
      type: object
      required: [verified, credentialId]
      properties:
        verified:
          type: boolean
        credentialId:
          type: string

    WebAuthnAuthOptionsInput:
      type: object
      properties:
        email:
          type: string

    WebAuthnAuthVerifyInput:
      type: object
      required: [response]
      properties:
        response:
          type: object
          description: AuthenticationResponseJSON from startAuthentication()
          additionalProperties: true

    PasskeyInfo:
      type: object
      required: [id, label, credentialId, createdAt]
      properties:
        id:
          type: number
        label:
          type: string
        credentialId:
          type: string
        createdAt:
          type: string
        lastUsedAt:
          type: ["string", "null"]

    PaymentInput:
      type: object
      required: [amount, currency, description]
      properties:
        amount:
          type: number
          minimum: 0.01
        currency:
          type: string
          minLength: 3
          maxLength: 3
        description:
          type: string
          minLength: 1
