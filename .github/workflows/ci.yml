name: CI

# All jobs have passed on GitHub Actions since 1b102b9 (2026-09-24).
# drizzle-kit's normal `push` prompts interactively on ambiguous schema
# changes, which hangs in CI — push-force below skips that prompt (safe here
# since the CI database is always fresh).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-analysis:
    name: Typecheck + dependency audit (dependency scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck + pnpm audit gated at --audit-level=critical (see
      # package.json's "ci" script and docs/04, Section 3).
      - run: pnpm run ci
      # Everything committed is Prettier-formatted (the pre-commit hook in .githooks does it locally;
      # this catches a commit made without it).
      - run: pnpm run format:check
      # The AI Security page serves results recorded from the team's Python
      # proof-of-concepts; fail if a PoC changed without them being regenerated.
      - run: python3 artifacts/ai-model/ai_security_report.py --check
      # Supplier integrity for the vendored face-api.js model weights: a
      # silently swapped model file fails the build (docs/11, element 15).
      - run: sha256sum -c artifacts/secureai/face-model-weights.sha256
      # The ClamAV client against a fake clamd: INSTREAM framing, and an
      # unreachable or confused scanner never being read as "clean".
      - run: pnpm --filter @workspace/api-server run verify:clamd
      # The encryption keyring: data stays readable through a key change, a dropped or
      # relabelled key fails loudly, and SESSION_SECRET stops opening data after the move.
      - run: pnpm --filter @workspace/api-server run verify:keyring
      # Security alert email: every listed address and no one else, no header injection from alert
      # text, and a mail server outage never stopping the alert job.
      - run: pnpm --filter @workspace/api-server run verify:alert-email
      # New passwords: common, breached and account-specific ones refused; only 5 hash characters
      # sent to Have I Been Pwned; an API outage falls back to the bundled list (R-AUTH-10).
      - run: pnpm --filter @workspace/api-server run verify:breached-passwords
      # The behaviour model's differential privacy: the noise is Laplace-shaped, one account's
      # influence stays capped, a planted canary leaks within budget, and BEHAVIOR_MODEL_DP_EPSILON
      # reaches the live suggestion endpoint (it didn't until 2026-10-07; docs/04 §2.2).
      - run: pnpm --filter @workspace/api-server run verify:dp
      # Data provenance: which uploads may feed which model (Team 2's acceptability matrix).
      - run: pnpm --filter @workspace/api-server run verify:provenance
      # Fairness spot-check of the topic profile across writers in eight languages (Team 2 risk R13).
      - run: pnpm --filter @workspace/api-server run verify:fairness
      # The deploy hook that installs ClamAV on the API instance.
      - run: shellcheck artifacts/api-server/.platform/hooks/prebuild/10_clamav.sh
      # The privacy policy text and the version the API records must match.
      - run: node scripts/check-privacy-policy-version.mjs

  semgrep-sast:
    name: Semgrep SAST scan (real tool, not the adversarial-probe substitute)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # p/owasp-top-ten + p/typescript/p/react are Semgrep's public community
      # rulesets (no login/token required) — this is the actual SAST tool the
      # brief names (§5.6), on top of (not instead of) the adversarial-probe
      # suite below, which stays a runtime/behavioral check the static scan
      # can't do. Fails the build on any finding (--error) rather than just
      # reporting, matching how pnpm audit is gated above.
      - run: semgrep scan --config p/owasp-top-ten --config p/typescript --config p/react --exclude-rule java.android.security.exported_activity.exported_activity --error

  dynamic-security-tests:
    name: Concurrency load test + adversarial probes (live server)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secureai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/secureai
      SESSION_SECRET: ci-test-secret-not-for-production
      NODE_ENV: development
      PORT: 8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/db run push-force
      # Before the server starts, while the database is still empty: it writes and deletes log rows,
      # then leaves the tables as it found them (docs/04 R-LOG-5).
      - name: Retention purge (12 months; AI challenge records 2 years; payments 7 years)
        run: pnpm --filter @workspace/api-server run verify:retention
        env:
          RETENTION_VERIFY_DISPOSABLE_DB: "yes"
      - run: pnpm --filter @workspace/api-server run build
      - name: Start API server in the background
        run: node artifacts/api-server/dist/index.mjs &
      - name: Wait for the API server to come up
        run: npx --yes wait-on http://localhost:8080/api/healthz --timeout 30000
      # Both scripts talk to the API server directly (port 8080) rather
      # than through the Vite proxy, so the frontend isn't started here.
      - name: Rate-limiter concurrency test (see R-AUTH-2)
        run: pnpm --filter @workspace/scripts run security:load-test
        env:
          LOAD_TEST_BASE_URL: http://localhost:8080
      - name: Adversarial probes (SQLi / CSRF / auth-bypass / IDOR / stored XSS)
        run: pnpm --filter @workspace/scripts run security:probes
        env:
          PROBES_BASE_URL: http://localhost:8080

  # DAST on every change (docs/10 section 3): an authenticated OWASP ZAP active scan of a fresh local
  # build, driven by the OpenAPI spec, as a user and as an admin; any Medium or High alert fails it.
  # Its own job, because the live-server job above uses the whole 10-an-hour sign-up allowance.
  dast-zap:
    name: OWASP ZAP active scan (DAST, live server)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secureai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/secureai
      SESSION_SECRET: ci-test-secret-not-for-production
      NODE_ENV: development
      PORT: 8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/db run push-force
      - run: pnpm --filter @workspace/api-server run build
      # Pinned release, checked against the SHA-256 ZAP publishes for it.
      - name: Download OWASP ZAP 2.17.0
        run: |
          curl -sSfL -o zap.tar.gz https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Linux.tar.gz
          echo "efe799aaa3627db683b43f00c9c210aea0b75c00cc8f0a0f0434d12bb3ddde5a  zap.tar.gz" | sha256sum -c -
          tar xzf zap.tar.gz -C "$RUNNER_TEMP"
      - name: Start API server in the background
        run: node artifacts/api-server/dist/index.mjs &
      - name: Wait for the API server to come up
        run: npx --yes wait-on http://localhost:8080/api/healthz --timeout 30000
      - name: ZAP active scan as a user and as an admin
        run: |
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          node scripts/security/dast/zap-local.mjs
        env:
          ZAP_HOME: ${{ runner.temp }}/ZAP_2.17.0
          LOCAL_PG_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/secureai
          ZAP_MAX_MINUTES: 5
