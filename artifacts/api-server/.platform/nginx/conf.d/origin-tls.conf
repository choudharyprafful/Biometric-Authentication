# The API's HTTPS listener for CloudFront (docs/04 R-SC-6). CloudFront connects here with the origin
# protocol policy https-only and checks the certificate against the environment's own hostname. The
# security group admits port 443 only from CloudFront's origin-facing addresses (docs/10 section 2).
#
# The certificate is Let's Encrypt's, issued and renewed by hooks/postdeploy/20_origin_tls.sh. Until
# it exists, hooks/prebuild/20_origin_tls_prepare.sh puts a self-signed stand-in at the same path so
# that nginx starts; CloudFront refuses the stand-in, so it is switched to HTTPS only once the real
# certificate is in place.

# The Connection header Elastic Beanstalk's own proxy sends (its nginx.conf has the same map).
map $http_upgrade $secureai_origin_connection {
    default "upgrade";
}

# Whether port 80 still serves the app (conf.d/elasticbeanstalk/00_application.conf): yes until
# ORIGIN_HTTP=off, for which hooks/prebuild/20_origin_tls_prepare.sh writes the included line.
map "port80" $secureai_origin_http {
    default "on";
    include /etc/secureai-origin/http*.map;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/pki/tls/secureai-origin/fullchain.pem;
    ssl_certificate_key /etc/pki/tls/secureai-origin/privkey.pem;

    # TLS 1.2 and 1.3 only, with forward-secret AEAD ciphers for 1.2 (NIST SP 800-52 Rev. 2).
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SecureAIOrigin:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    access_log            /var/log/nginx/access.log main;
    client_header_timeout 60;
    client_body_timeout   60;
    keepalive_timeout     60;

    # The same proxy to the app as Elastic Beanstalk's port-80 server
    # (conf.d/elasticbeanstalk/00_application.conf).
    location / {
        proxy_pass          http://127.0.0.1:8080;
        proxy_http_version  1.1;

        proxy_set_header    Connection          $secureai_origin_connection;
        proxy_set_header    Upgrade             $http_upgrade;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    }

    # Elastic Beanstalk's health log, so enhanced health counts these requests as it does port 80's.
    include conf.d/elasticbeanstalk/healthd*.conf;
}
