# Elastic Beanstalk's proxy to the app on port 80, replacing its own 00_application.conf with the
# same settings plus one switch (docs/04 R-SC-6). Once CloudFront connects over HTTPS, the
# ORIGIN_HTTP=off environment property stops port 80 serving the app, leaving it only Let's
# Encrypt's check (10_acme_challenge.conf), so it can stay open for renewals without letting
# anyone reach the API around CloudFront. hooks/prebuild/20_origin_tls_prepare.sh sets the switch.
location / {
    if ($secureai_origin_http = "off") {
        return 404;
    }

    proxy_pass          http://127.0.0.1:8080;
    proxy_http_version  1.1;

    proxy_set_header    Connection          $secureai_origin_connection;
    proxy_set_header    Upgrade             $http_upgrade;
    proxy_set_header    Host                $host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
}
