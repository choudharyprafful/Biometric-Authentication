# Let's Encrypt's HTTP-01 check for the origin certificate (hooks/postdeploy/20_origin_tls.sh, docs/04
# R-SC-6): certbot writes a token under this directory, and Let's Encrypt fetches it over port 80.
# Elastic Beanstalk includes this file in its port-80 server only.
location ^~ /.well-known/acme-challenge/ {
    root         /var/www/secureai-acme;
    default_type text/plain;
    try_files    $uri =404;
}
